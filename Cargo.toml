[package]
name = "fluxv6-load-tester"
version = "8.20.2026"
edition = "2021"
authors = ["khaninkali <khaninkali@hypersecurity.>"]
description = "Advanced Network Load Testing Tool with Email Support - FluxV6"
license = "GPL-3.0-or-later"
repository = "https://github.com/khaninkali/"
keywords = ["security", "load-testing", "network", "email-testing", "penetration-testing"]
categories = ["command-line-utilities", "network-programming", "email"]

[[bin]]
name = "fluxv6"
path = "fluxv6.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Async utilities
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Email protocols
lettre = "0.11"
imap = "2.4"
mailparse = "0.14"

# TLS/SSL handling
native-tls = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
sha2 = "0.10"

# Error handling
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Command line interface
clap = { version = "4.0", features = ["derive"] }

# Random number generation
rand = "0.8"

# Colored terminal output
colored = "2.1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Base64 encoding
base64 = "0.22.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
